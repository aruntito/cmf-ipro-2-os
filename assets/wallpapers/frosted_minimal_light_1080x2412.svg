<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2412" width="1080" height="2412">
  <defs>
    <linearGradient id="monoLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F2F3F5"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>

    <radialGradient id="monoLightShade" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="monoLightBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <linearGradient id="monoLightHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="2412" fill="url(#monoLightGrad)"/>

  <g filter="url(#monoLightBlur)">
    <circle cx="540" cy="700" r="450" fill="url(#monoLightShade)"/>
    <circle cx="540" cy="1800" r="480" fill="url(#monoLightShade)"/>
  </g>

  <!-- Precision Minimal Lines (Light) -->
  <g stroke="url(#monoLightHighlight)" stroke-width="1.5" fill="none">
    <rect x="70" y="240" width="940" height="420" rx="44" ry="44" fill="#FFFFFF" fill-opacity="0.4"/>
    <rect x="70" y="740" width="940" height="1140" rx="48" ry="48" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="90" y="2060" width="900" height="210" rx="52" ry="52" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>
</svg>
