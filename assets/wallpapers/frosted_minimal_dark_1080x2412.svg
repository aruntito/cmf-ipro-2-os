<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2412" width="1080" height="2412">
  <defs>
    <linearGradient id="monoDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0B0D"/>
      <stop offset="50%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#060708"/>
    </linearGradient>

    <radialGradient id="monoSilverGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#8E8E93" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="monoBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <linearGradient id="monoHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="2412" fill="url(#monoDarkGrad)"/>

  <g filter="url(#monoBlur)">
    <circle cx="540" cy="700" r="450" fill="url(#monoSilverGlow)"/>
    <circle cx="540" cy="1800" r="480" fill="url(#monoSilverGlow)"/>
  </g>

  <!-- Precision Minimal Lines -->
  <g stroke="url(#monoHighlight)" stroke-width="1.2" fill="none">
    <rect x="70" y="240" width="940" height="420" rx="44" ry="44" fill="#FFFFFF" fill-opacity="0.02"/>
    <rect x="70" y="740" width="940" height="1140" rx="48" ry="48" fill="#FFFFFF" fill-opacity="0.015"/>
    <rect x="90" y="2060" width="900" height="210" rx="52" ry="52" fill="#FFFFFF" fill-opacity="0.025"/>
  </g>
</svg>
