<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="cmfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5200"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <linearGradient id="iconSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect x="8" y="8" width="176" height="176" rx="44" ry="44" fill="url(#cmfBg)"/>
  <!-- Frosted Specular Rim -->
  <rect x="9" y="9" width="174" height="174" rx="43" ry="43" fill="none" stroke="url(#iconSpecular)" stroke-width="2"/>

  <!-- Center Tactile Core -->
  <circle cx="96" cy="74" r="14" fill="#FFFFFF"/>
  <!-- CMF Monogram Typography -->
  <text x="96" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
        font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">CMF</text>
  <!-- Hardware Key Indicator Subtitle -->
  <text x="96" y="152" font-family="'JetBrains Mono', monospace" 
        font-size="11" font-weight="700" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle" letter-spacing="1">ESSENTIAL</text>
</svg>
