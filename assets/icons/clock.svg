<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="clockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C20"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>
    <linearGradient id="iconSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect x="8" y="8" width="176" height="176" rx="44" ry="44" fill="url(#clockBg)"/>
  <!-- Frosted Specular Rim -->
  <rect x="9" y="9" width="174" height="174" rx="43" ry="43" fill="none" stroke="url(#iconSpecular)" stroke-width="2"/>

  <!-- Dial Marks -->
  <circle cx="96" cy="96" r="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
  <line x1="96" y1="40" x2="96" y2="48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="152" y1="96" x2="144" y2="96" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="152" x2="96" y2="144" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="96" x2="48" y2="96" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Clock Hands -->
  <line x1="96" y1="96" x2="96" y2="58" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="96" y1="96" x2="128" y2="96" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="96" y1="106" x2="72" y2="76" stroke="#FF5200" stroke-width="2" stroke-linecap="round"/>
  <circle cx="96" cy="96" r="4.5" fill="#FF5200"/>
</svg>
